<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Audio Decibel Meter Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--muted); font-size: 0.875rem; margin-bottom: 2rem; line-height: 1.4; }
    .meter-display {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 2.5rem 1rem;
      margin-bottom: 1.5rem;
    }
    .db-value {
      font-size: 4rem;
      font-weight: 800;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .db-unit { font-size: 1.25rem; color: var(--muted); margin-top: 0.5rem; font-weight: 500; }
    .status-text { color: var(--muted); font-size: 0.875rem; min-height: 1.25rem; margin-bottom: 1.5rem; }
    button {
      background-color: var(--primary);
      color: #0f172a;
      border: none;
      padding: 0.875rem 1.75rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    button:hover { background-color: var(--primary-hover); }
    button.running { background-color: #ef4444; color: white; }
    footer {
      margin-top: 2rem;
      font-size: 0.8125rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }
    footer a { color: var(--primary); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <main class="card">
    <h1>Web Audio Decibel Meter</h1>
    <p class="subtitle">Client-side acoustic DSP demonstration using standard browser Web Audio API.</p>

    <div class="meter-display">
      <div id="db-reading" class="db-value">--</div>
      <div class="db-unit">dB (relative)</div>
    </div>

    <div id="status" class="status-text">Click Start to request microphone access</div>
    <button id="toggle-btn">Start Microphone</button>

    <footer>
      <p>MIT License • Minimal open-source reference snippet.</p>
      <p>For calibrated weighting (dBA/dBC) and acoustic tools, visit <a href="https://soundleveltest.com" target="_blank" rel="noopener">Sound Level Test</a>.</p>
    </footer>
  </main>

  <script>
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let stream = null;
    let isRunning = false;
    let animationId = null;
    let smoothedDb = 0;

    const btn = document.getElementById('toggle-btn');
    const dbDisplay = document.getElementById('db-reading');
    const statusText = document.getElementById('status');

    btn.addEventListener('click', async () => {
      if (!isRunning) {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });

          sourceNode = audioCtx.createMediaStreamSource(stream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0.8;
          sourceNode.connect(analyser);

          isRunning = true;
          btn.textContent = 'Stop Microphone';
          btn.classList.add('running');
          statusText.textContent = 'Listening... (All audio processed locally)';
          updateMeter();
        } catch (err) {
          statusText.textContent = 'Microphone permission denied or unsupported.';
          console.error(err);
        }
      } else {
        stopAudio();
      }
    });

    function updateMeter() {
      if (!isRunning) return;

      const buffer = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buffer);

      // Calculate Root Mean Square (RMS)
      let sumSquares = 0;
      for (let i = 0; i < buffer.length; i++) {
        sumSquares += buffer[i] * buffer[i];
      }
      const rms = Math.sqrt(sumSquares / buffer.length);

      // Convert RMS to decibels relative to full scale (dBFS)
      // Reference baseline calibration offset of ~100 dB for approximate ambient level
      let db = rms > 0.00001 ? 20 * Math.log10(rms) + 100 : 0;
      db = Math.max(25, Math.min(115, db)); // Clamp between 25 dB and 115 dB

      // Exponential smoothing for natural meter movement
      smoothedDb = (smoothedDb * 0.85) + (db * 0.15);
      dbDisplay.textContent = Math.round(smoothedDb);

      animationId = requestAnimationFrame(updateMeter);
    }

    function stopAudio() {
      isRunning = false;
      if (animationId) cancelAnimationFrame(animationId);
      if (stream) stream.getTracks().forEach(t => t.stop());
      if (audioCtx) audioCtx.close();
      btn.textContent = 'Start Microphone';
      btn.classList.remove('running');
      dbDisplay.textContent = '--';
      statusText.textContent = 'Microphone stopped.';
      smoothedDb = 0;
    }
  </script>
</body>
</html>
